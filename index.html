<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper Trails — IS literature review</title>
  <meta name="description" content="Paper Trails: a structured literature review workbench for Information Systems scholars, after Webster & Watson (2002) — main review within IS, outside-IS search, and backward/forward citation tracing." />
  <link rel="icon" type="image/png" href="/misclaw.png" />
  <script>
    // Shared misclaw theme: a cookie scoped to .misclaw.app keeps the light/dark
    // choice in sync across every *.misclaw.app site; localStorage is the
    // same-origin fallback (local dev). Read before paint to avoid a flash.
    (function () {
      try {
        var m = document.cookie.match(/(?:^|;\s*)mc-theme=(light|dark)\b/);
        var t = m ? m[1] : localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <!-- Google Analytics (GA4) — production *.misclaw.app only -->
  <script>
    (function () {
      var h = location.hostname;
      if (h !== "misclaw.app" && !h.endsWith(".misclaw.app")) return;
      var id = "G-RS1NQQW0VS";
      var s = document.createElement("script"); s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); } window.gtag = gtag;
      gtag("js", new Date()); gtag("config", id);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"><p class="boot">Loading…</p></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
