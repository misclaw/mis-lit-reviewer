<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Paper Trails app icon: warm paper card, ink wordmark, the ◀ · ▶ motif -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f3"/>
      <stop offset="1" stop-color="#efeade"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#paper)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#d8d0bd" stroke-width="8"/>
  <!-- backward · main · forward -->
  <g fill="#9c6b1c">
    <path d="M 360 400 L 250 512 L 360 624 Z"/>
    <circle cx="512" cy="512" r="58"/>
    <path d="M 664 400 L 774 512 L 664 624 Z"/>
  </g>
  <text x="512" y="800" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="132" fill="#201d17">Paper Trails</text>
</svg>
